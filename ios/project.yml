name: Catchline
options:
  developmentLanguage: en
  bundleIdPrefix: com.deskfox
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: GZ4LT9W9H9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # Everything is main-actor by default; audio/network types opt out explicitly.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Catchline:
    type: application
    platform: iOS
    sources: [Catchline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deskfox.catchline
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: CatchLine
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Catchline/Catchline.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Catchline/Catchline.Release.entitlements
    info:
      path: Catchline/Info.plist
      properties:
        CFBundleDisplayName: CatchLine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: CatchLine uses the microphone to hear the conversation around you and show live captions and translations.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Debug builds can talk to the local Vite mock (http://localhost:5173).
          NSAllowsLocalNetworking: true
  CatchlineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CatchlineTests]
    dependencies:
      - target: Catchline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deskfox.catchline.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Catchline:
    build:
      targets:
        Catchline: all
        CatchlineTests: [test]
    test:
      targets: [CatchlineTests]
